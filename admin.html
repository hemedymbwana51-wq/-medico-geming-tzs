<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#07021a">
<title>MEDICO GAMING TZS - Admin</title>
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-512.png">
<link rel="manifest" href="manifest.json">
<style>
:root{--bg:#07021a;--bg2:#0e0630;--blue:#19d3ff;--pink:#ff2bd6;--purple:#8a2bff;--txt:#e9e6ff;--mut:#9a93c9;--card:rgba(20,10,55,.78);--line:rgba(25,211,255,.25)}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:14px;color-scheme:dark}
body{min-height:100vh;background:radial-gradient(ellipse at top,#1b0640 0%,var(--bg) 55%,#020008 100%);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:14px;line-height:1.45;padding-bottom:env(safe-area-inset-bottom,0px)}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(255,43,214,.08),transparent 40%,rgba(25,211,255,.06))}
a{color:inherit;text-decoration:none}
button{cursor:pointer;font-family:inherit}
input,select,textarea{font-family:inherit}

/* topbar */
.topbar{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 5vw;padding-top:calc(10px + env(safe-area-inset-top,0px));background:rgba(7,2,26,.7);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:9px;font-weight:900;letter-spacing:.12em;font-size:.85rem}
.brand svg{width:30px;height:30px;filter:drop-shadow(0 0 6px var(--blue))}
.brand b{background:linear-gradient(90deg,var(--blue),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent}
.brand small{display:block;font-size:.55rem;letter-spacing:.3em;color:var(--mut);font-weight:700}
.back{font-size:.68rem;letter-spacing:.12em;color:var(--blue);border:1px solid var(--blue);padding:7px 11px;border-radius:7px;font-weight:800}

/* main */
main{position:relative;max-width:900px;margin:0 auto;padding:16px 14px 40px}
.intro{padding:16px 4px 6px}
.intro h1{font-size:1.1rem;letter-spacing:.14em;text-transform:uppercase;background:linear-gradient(100deg,var(--blue) 10%,#fff 50%,var(--pink) 90%);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:900}
.intro p{color:var(--mut);font-size:.8rem;margin-top:4px}

/* kadi kuu */
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-top:14px;box-shadow:0 0 30px rgba(255,43,214,.12)}
.panel.login{max-width:440px;margin:24px auto 0;border-top:3px solid var(--pink)}
h2{font-size:1rem;letter-spacing:.1em;text-transform:uppercase;color:#fff;margin-bottom:6px}
h2 span,.accent{color:var(--pink);text-shadow:0 0 12px var(--pink)}
h3{font-size:.85rem;letter-spacing:.1em;text-transform:uppercase;color:var(--blue);margin:16px 0 8px}
label{display:block;font-size:.72rem;color:var(--blue);margin-top:10px;letter-spacing:.04em}
input,select,textarea{width:100%;padding:10px 11px;margin:5px 0 8px;background:#08031d;color:var(--txt);border:1px solid rgba(25,211,255,.3);border-radius:8px;font-size:.82rem;outline:none}
input:focus,select:focus,textarea{border-color:var(--pink)}
textarea{min-height:70px;resize:vertical}
.muted{color:var(--mut);font-size:.78rem}
.loginmsg{margin-top:10px;font-size:.78rem;color:#ffb3d9;min-height:1em}

/* vitufe */
.primary{background:linear-gradient(90deg,var(--blue),var(--purple));color:#08021a;border:0;padding:10px 16px;border-radius:8px;font-weight:900;font-size:.76rem;letter-spacing:.08em;width:100%;margin-top:8px;box-shadow:0 0 16px rgba(25,211,255,.3)}
.primary:hover{box-shadow:0 0 24px rgba(25,211,255,.6)}
.secondary{background:rgba(255,255,255,.05);color:var(--txt);border:1px solid rgba(154,147,201,.45);padding:8px 14px;border-radius:99px;font-weight:800;font-size:.7rem;letter-spacing:.1em}
.secondary:hover{border-color:var(--pink);color:#fff}
.secondary.on{border-color:var(--pink);background:rgba(255,43,214,.2)}
.danger{background:linear-gradient(90deg,#b8324f,#7a1f5e);color:#fff;border:0;padding:8px 12px;border-radius:7px;font-weight:800;font-size:.7rem;letter-spacing:.06em;margin-top:8px}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 4px}

/* orodha ya magemu */
.admin-list{padding:12px 0;border-bottom:1px solid rgba(255,255,255,.1)}
.admin-list strong{display:block;font-size:.9rem;color:#fff}
.admin-list small{display:block;color:var(--mut);font-size:.74rem;margin-top:2px}
#gPreview{display:block;max-width:100%;border-radius:10px;border:1px solid var(--line);margin:6px 0 10px}

/* toast */
.toast{display:none;position:fixed;z-index:50;bottom:20px;left:5%;width:90%;max-width:520px;margin:0 auto;padding:12px;background:var(--blue);color:#07021a;border-radius:9px;text-align:center;font-weight:800;font-size:.8rem;box-shadow:0 0 22px rgba(25,211,255,.5)}

/* modal (ya game details, inahitajika na app.js) */
.modal{position:fixed;inset:0;z-index:30;background:rgba(3,1,15,.88);display:grid;place-items:center;padding:14px}
.hidden{display:none!important}
.modal-card{position:relative;width:min(100%,520px);max-height:90vh;overflow:auto;padding:20px;border-radius:14px;background:#10072b;border:1px solid rgba(25,211,255,.45)}
.paybox{padding:12px;margin:12px 0;background:rgba(25,211,255,.08);border:1px dashed var(--blue);border-radius:8px;font-size:.78rem}
.close{float:right;background:none;border:0;color:#fff;font-size:24px}

@media(min-width:640px){.panel{padding:22px}}
</style>
</head>
<body>

<header class="topbar">
  <a class="brand" href="index.html" aria-label="Rudi kwenye website">
    <img class="logo" src="icon-192.png" alt="MEDICO" style="width:34px;height:34px;border-radius:9px;object-fit:cover;display:block">
    <span><b>MEDICO</b> GAMING TZS<small>ADMIN DASHBOARD</small></span>
  </a>
  <a class="back" href="index.html">← WEBSITE</a>
</header>

<main>
  <section class="intro">
    <h1>Medico Admin</h1>
    <p>Ingia kusimamia magemu na malipo.</p>
  </section>

  <div id="adminModal" class="panel login">
    <div id="adminArea">
      <h2>MEDICO ADMIN LOGIN</h2>
      <label>Email ya Admin</label>
      <input id="adminEmail" type="email" placeholder="Email">
      <label>Password</label>
      <input id="adminPass" type="password" placeholder="Password">
      <button class="primary" id="adminLogin" type="button">INGIA</button>
      <div id="loginMsg" class="loginmsg"></div>
    </div>
  </div>
</main>

<div id="gameModal" class="modal hidden">
  <div class="modal-card"><button class="close" data-close="gameModal" aria-label="Funga">×</button><div id="gameDetails"></div></div>
</div>

<div id="toast" class="toast"></div>
<div id="isAdminPage" hidden></div>

<script type="module" src="app.js"></script>
</body>
</html>
